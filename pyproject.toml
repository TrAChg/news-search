[project]
name = "historical-news-search"
version = "0.1.0"
description = "Multilingual search for historical French newspaper images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
    "opencv-python>=4.8.1.78",
    "Pillow>=10.0.1",
    "pandas>=2.1.1",
    "torch>=2.1.0",
    "transformers>=4.34.0",
    "sentence-transformers>=2.2.2",
    "chromadb>=0.4.14",
    "fastapi>=0.103.2",
    "uvicorn>=0.23.2",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "jupyterlab>=4.0.7",
    "tqdm>=4.66.1",
    "curl-cffi>=0.16.3",
    "lxml>=6.1.3",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true
disallow_untyped_decorators = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
